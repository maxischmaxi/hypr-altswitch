# Compile check only — a built .so is worthless to anyone else, since Hyprland
# plugins are ABI-bound to the exact version they were built against. What this
# is actually for: when Arch ships a Hyprland that changed an internal API, this
# job goes red before the next `make clean && make` on the workstation does.
name: build

on:
  push:
  pull_request:
  schedule:
    # Weekly, so an upstream API break surfaces without a push.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Hyprland headers
        run: pacman -Syu --noconfirm hyprland pkgconf luajit git

      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          echo "hyprland: $(pkg-config --modversion hyprland)"
          gcc --version | head -1

      - name: Build
        run: make

      - name: Check the plugin exports its entry points
        run: |
          nm -D --defined-only build/hypr-altswitch.so | grep -E "pluginAPIVersion|pluginInit|pluginExit"
