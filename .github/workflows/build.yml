# Compile check only — a built .so is worthless to anyone else, since Hyprland
# plugins are ABI-bound to the exact version they were built against. This
# verifies that a tagged release still builds against current Arch Hyprland.
name: build

on:
  push:
    tags:
      # 0.1.0 and v0.1.0 both count; nothing else triggers this.
      - "[0-9]*"
      - "v[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Hyprland headers
        run: pacman -Syu --noconfirm hyprland pkgconf luajit git

      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          echo "hyprland: $(pkg-config --modversion hyprland)"
          gcc --version | head -1

      - name: Build
        run: make

      - name: Check the plugin exports its entry points
        run: |
          nm -D --defined-only build/hypr-altswitch.so | grep -E "pluginAPIVersion|pluginInit|pluginExit"
